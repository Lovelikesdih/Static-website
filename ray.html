<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>How I Met Ray</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <audio id="bgAudio" autoplay loop>
        <source src="Stuff for people/Ray.mp3" type="audio/mpeg">
    </audio>
    <div class="volume-slider-container">
        <input class="volume-slider" type="range" min="0" max="1" step="0.01" value="0.5">
    </div>
    <main style="max-width:700px;margin:50px auto;color:white;font-family:'Courier New',Courier,monospace;text-align:center;">
        <img src="pics/Ray's pfp.jpg" alt="Ray" class="profile-pic" style="width:150px;height:150px;border-radius:50%;border:4px solid var(--accent);margin-bottom:20px;box-shadow:0 4px 8px rgba(0,0,0,0.3);">
        <h1>Ray</h1>
        <p>so me and ray met a long time ago but we never started talking and we forgot about each other but then he had joined me one day and asked who i was then it went on from there and now he is like a brother to me thank you for being there for me ray</p>
        <a href="index.html" style="display:inline-block;margin-top:30px;padding:10px 20px;border-radius:30px;background:var(--accent);color:black;text-decoration:none;">Back to Profiles</a>
    </main>
    <script>
        const audio = document.getElementById("bgAudio");
        const slider = document.querySelector(".volume-slider");
        if(slider){
            audio.volume = slider.value;
            slider.addEventListener("input", () => { audio.volume = slider.value; });
        }
    </script>
</body>
</html>
